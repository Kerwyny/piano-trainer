name: PianoTrainer
options:
  bundleIdPrefix: com.kerwyny
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  PianoTrainer:
    type: application
    platform: iOS
    scheme: {}
    info:
      path: PianoTrainerNative/Info.plist
      properties:
        CFBundleDisplayName: 读谱训练
        NSBluetoothAlwaysUsageDescription: Connect to a piano or MIDI keyboard for note-reading practice.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    sources:
      - path: PianoTrainerNative
        excludes:
          - Info.plist
      - path: ../index.html
        buildPhase: resources
      - path: ../styles.css
        buildPhase: resources
      - path: ../app.js
        buildPhase: resources
      - path: ../sw.js
        buildPhase: resources
      - path: ../manifest.webmanifest
        buildPhase: resources
      - path: ../icon-192.png
        buildPhase: resources
      - path: ../icon-512.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kerwyny.pianotrainer
        TARGETED_DEVICE_FAMILY: '1'
        IPHONEOS_DEPLOYMENT_TARGET: '16.0'
